# Run from the repo root:  docker compose -f docker/docker-compose.yml up -d --build
# Needs docker/.env (copy docker/.env.example) and `git submodule update --init`.
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      # Default DB for the sql/0x scripts (they have no USE); the upstream dumps select their own.
      MARIADB_DATABASE: wres2
    volumes:
      - db_data:/var/lib/mysql
      - ../WarRock-Chapter-1-Server/Databases/LoginServer.SQL:/docker-entrypoint-initdb.d/01-login.sql:ro
      - ../WarRock-Chapter-1-Server/Databases/GameServer.SQL:/docker-entrypoint-initdb.d/02-game.sql:ro
      - ../sql/03-activate-item-shop.sql:/docker-entrypoint-initdb.d/03-activate-item-shop.sql:ro
      - ../sql/04-nickchange.sql:/docker-entrypoint-initdb.d/04-nickchange.sql:ro
      - ../sql/05-boosters.sql:/docker-entrypoint-initdb.d/05-boosters.sql:ro
      - ../sql/06-weapons.sql:/docker-entrypoint-initdb.d/06-weapons.sql:ro
      - ../sql/07-activate-extra.sql:/docker-entrypoint-initdb.d/07-activate-extra.sql:ro
      - ../sql/08-server-extensions.sql:/docker-entrypoint-initdb.d/08-server-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure

  auth:
    build:
      context: ../node
      dockerfile: ../docker/Dockerfile
    command: ["node", "auth-server.js"]
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5330:5330"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(5330,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure

  game:
    build:
      context: ../node
      dockerfile: ../docker/Dockerfile
    command: ["node", "game-server.js"]
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      GAME_AUTH_HOST: auth
      # IP the server list hands to clients: 127.0.0.1 = same machine only.
      GAME_SERVER_IP: ${SERVER_IP:-127.0.0.1}
    ports:
      - "5340:5340"
      - "5350:5350/udp"
      - "5351:5351/udp"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(5340,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: on-failure

volumes:
  db_data:
