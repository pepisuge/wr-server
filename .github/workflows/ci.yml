name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd node && npm ci
      - name: Syntax check
        run: find node -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Forbidden files
        run: |
          if git ls-files | grep -Ei '\.(exe|dll|rar|zip|7z|dds|tga|bin)$|items\.bin|weapondata'; then exit 1; fi
